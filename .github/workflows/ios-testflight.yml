name: iOS TestFlight
run-name: iOS TestFlight ${{ inputs.marketing_version }} (${{ inputs.build_number || github.run_number }}) upload=${{ inputs.upload_to_testflight }}

# Manual App Store Connect / TestFlight lane. Tag `v*` releases upload
# automatically from github-release.yml; use this workflow to re-upload,
# pick a build number, or change internal vs export-only.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: CFBundleShortVersionString for the TestFlight build.
        required: true
        type: string
        default: "0.1.0"
      build_number:
        description: CFBundleVersion. Defaults to the GitHub run number when empty.
        required: false
        type: string
      upload_to_testflight:
        description: Upload the signed archive to App Store Connect/TestFlight.
        required: true
        type: boolean
        default: false
      internal_testing_only:
        description: Mark uploaded builds as internal testing only.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_TOOLCHAIN: 1.97.0

jobs:
  testflight:
    name: Archive and Upload iOS TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
      FIRE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      FIRE_CODE_SIGN_STYLE: ${{ vars.IOS_CODE_SIGN_STYLE || 'Automatic' }}
      FIRE_MARKETING_VERSION: ${{ inputs.marketing_version }}
      FIRE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      FIRE_PRODUCT_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_ID || 'com.fire.app.ios' }}
      FIRE_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      FIRE_CODE_SIGN_IDENTITY: ${{ vars.IOS_CODE_SIGN_IDENTITY || vars.IOS_EXPORT_SIGNING_CERTIFICATE }}
      EXPORT_SIGNING_CERTIFICATE: ${{ vars.IOS_EXPORT_SIGNING_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify Xcode 26 App Store toolchain
        shell: bash
        run: ./scripts/ios/verify_xcode26_toolchain.sh
      - name: Install Rust toolchain and iOS targets
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}
          workspaces: |
            . -> rust/target

      - name: Install XcodeGen
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Prepare App Store Connect API key
        run: ./scripts/ios/prepare_app_store_connect_api_key.sh

      - name: Install optional signing certificate and profile
        run: ./scripts/ios/install_distribution_signing.sh

      - name: Archive and export TestFlight build
        shell: bash
        env:
          TESTFLIGHT_UPLOAD_INPUT: ${{ inputs.upload_to_testflight }}
          TESTFLIGHT_INTERNAL_ONLY_INPUT: ${{ inputs.internal_testing_only }}
        run: |
          set -euo pipefail
          testflight_upload="NO"
          if [[ "$TESTFLIGHT_UPLOAD_INPUT" == "true" ]]; then
            testflight_upload="YES"
          fi

          internal_only="NO"
          if [[ "$TESTFLIGHT_INTERNAL_ONLY_INPUT" == "true" ]]; then
            internal_only="YES"
          fi

          CODE_SIGNING_ALLOWED=YES \
          ALLOW_PROVISIONING_UPDATES=YES \
          TESTFLIGHT_UPLOAD="$testflight_upload" \
          TESTFLIGHT_INTERNAL_ONLY="$internal_only" \
          EXPORT_METHOD=app-store-connect \
          EXPORT_DESTINATION=export \
          FIRE_GIT_SHA="${GITHUB_SHA}" \
          OUT_ROOT="${GITHUB_WORKSPACE}/artifacts/ios-testflight" \
          ./scripts/ios/archive_release.sh

      - name: Upload TestFlight release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-release
          path: artifacts/ios-testflight
          if-no-files-found: error
