			shellPath = /bin/bash;
			shellScript = "#!/usr/bin/env bash\nset -euo pipefail\n\nif [[ \"${FIRE_SKIP_UNIFFI_BINDGEN:-}\" == \"1\" ]]; then\n  echo \"FIRE_SKIP_UNIFFI_BINDGEN=1: skipping UniFFI binding generation (using pre-built artifacts)\"\n  exit 0\nfi\n\nscript_dir=\"$(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")\" && pwd)\"\nproject_root=\"${SRCROOT:-$(cd -- \"$script_dir/..\" && pwd)}\"\nrepo_root=\"$(cd -- \"$project_root/../..\" && pwd)\"\ngenerated_dir=\"$project_root/Generated\"\nswift_out_dir=\"$generated_dir/FireUniFfi\"\nffi_out_dir=\"$generated_dir/fire_uniffiFFI\"\nlib_out_root=\"$generated_dir/lib\"\nuniffi_config_path=\"$repo_root/crates/fire-uniffi/uniffi.toml\"\n\nexport PATH=\"$HOME/.cargo/bin:$PATH\"\n\ncargo_bin=\"${CARGO:-$(command -v cargo || true)}\"\nrustup_bin=\"${RUSTUP:-$(command -v rustup || true)}\"\n\nif [[ -z \"$cargo_bin\" ]]; then\n  echo \"unable to locate cargo in PATH\" >&2\n  exit 1\nfi\n\nif [[ -z \"$rustup_bin\" ]]; then\n  echo \"unable to locate rustup in PATH\" >&2\n  exit 1\nfi\n\nplatform_name=\"${PLATFORM_NAME:-iphonesimulator}\"\nconfiguration_name=\"${CONFIGURATION:-Debug}\"\nprofile_dir=\"debug\"\n\nif [[ \"$configuration_name\" == \"Release\" ]]; then\n  profile_dir=\"release\"\nfi\n\ntmp_dir=\"$(mktemp -d \"${TMPDIR:-/tmp}/fire-ios-uniffi.XXXXXX\")\"\ntrap 'rm -rf \"$tmp_dir\"' EXIT\n\nmkdir -p \"$swift_out_dir\" \"$ffi_out_dir\" \"$lib_out_root/$platform_name\"\nrm -f \"$generated_dir/fire_uniffiFFI.h\" \"$generated_dir/fire_uniffiFFI.modulemap\"\nrm -f \"$generated_dir/fire_uniffi.swift\"\nrm -f \"$swift_out_dir\"/*.swift\n\nensure_rust_target_installed() {\n  local rust_target=\"$1\"\n  local installed_targets\n\n  installed_targets=\"$(\n    env \\\n      HOME=\"$HOME\" \\\n      PATH=\"$PATH\" \\\n      RUSTUP_HOME=\"${RUSTUP_HOME:-$HOME/.rustup}\" \\\n      \"$rustup_bin\" target list --installed\n  )\"\n\n  if ! grep -qx \"$rust_target\" <<<\"$installed_targets\"; then\n    echo \"required Rust target is not installed: $rust_target\" >&2\n    echo \"run: rustup target add $rust_target\" >&2\n    exit 1\n  fi\n}\n\nmap_simulator_arch_to_rust_target() {\n  local arch=\"$1\"\n\n  case \"$arch\" in\n    arm64)\n      printf '%s\\n' \"aarch64-apple-ios-sim\"\n      ;;\n    x86_64)\n      printf '%s\\n' \"x86_64-apple-ios\"\n      ;;\n    *)\n      echo \"unsupported iOS simulator arch: $arch\" >&2\n      exit 1\n      ;;\n  esac\n}\n\ndeclare -a rust_targets=()\n\ncase \"$platform_name\" in\n  iphoneos)\n    if [[ -z \"${IPHONEOS_DEPLOYMENT_TARGET:-}\" ]]; then\n      export IPHONEOS_DEPLOYMENT_TARGET=\"16.0\"\n    fi\n    rust_targets=(\"aarch64-apple-ios\")\n    ;;\n  iphonesimulator)\n    if [[ -n \"${ARCHS:-}\" ]]; then\n      for arch in $ARCHS; do\n        rust_targets+=(\"$(map_simulator_arch_to_rust_target \"$arch\")\")\n      done\n    else\n      case \"$(uname -m)\" in\n        arm64)\n          rust_targets=(\"aarch64-apple-ios-sim\")\n          ;;\n        x86_64)\n          rust_targets=(\"x86_64-apple-ios\")\n          ;;\n        *)\n          echo \"unable to infer simulator Rust target from host architecture\" >&2\n          exit 1\n          ;;\n      esac\n    fi\n    ;;\n  *)\n    echo \"unsupported PLATFORM_NAME: $platform_name\" >&2\n    exit 1\n    ;;\nesac\n\ndedupe_targets() {\n  local seen=\"\"\n  local rust_target\n  local deduped=()\n\n  for rust_target in \"${rust_targets[@]}\"; do\n    if [[ \" $seen \" == *\" $rust_target \"* ]]; then\n      continue\n    fi\n\n    seen+=\" $rust_target\"\n    deduped+=(\"$rust_target\")\n  done\n\n  rust_targets=(\"${deduped[@]}\")\n}\n\nbuild_staticlib() {\n  local rust_target=\"$1\"\n  local output_lib=\"$repo_root/target/$rust_target/$profile_dir/libfire_uniffi.a\"\n\n  if [[ \"${FIRE_SKIP_RUST_CROSS_BUILD:-}\" == \"1\" ]]; then\n    if [[ ! -f \"$output_lib\" ]]; then\n      echo \"FIRE_SKIP_RUST_CROSS_BUILD=1 but $output_lib not found\" >&2\n      exit 1\n    fi\n    echo \"skipping cargo build: using pre-built $output_lib\"\n    return 0\n  fi\n\n  if [[ \"$profile_dir\" == \"release\" ]]; then\n    (\n      cd \"$repo_root\"\n      run_target_cargo \"$cargo_bin\" build -p fire-uniffi --target \"$rust_target\" --release\n    )\n  else\n    (\n      cd \"$repo_root\"\n      run_target_cargo \"$cargo_bin\" build -p fire-uniffi --target \"$rust_target\"\n    )\n  fi\n}\n\nrun_host_cargo() {\n  if [[ \"$(uname -s)\" == \"Darwin\" ]]; then\n    local sdk_root\n    local library_path\n\n    sdk_root=\"$(xcrun --sdk macosx --show-sdk-path)\"\n    library_path=\"${sdk_root}/usr/lib\"\n\n    env -i \\\n      HOME=\"$HOME\" \\\n      PATH=\"$PATH\" \\\n      SDKROOT=\"$sdk_root\" \\\n      LIBRARY_PATH=\"$library_path\" \\\n      PLATFORM_NAME= \\\n      EFFECTIVE_PLATFORM_NAME= \\\n      ARCHS= \\\n      TVOS_DEPLOYMENT_TARGET= \\\n      WATCHOS_DEPLOYMENT_TARGET= \\\n      \"$@\"\n  else\n    \"$@\"\n  fi\n}\n\nrun_target_cargo() {\n  if [[ \"$(uname -s)\" == \"Darwin\" ]]; then\n    local sdk_root\n    local iphoneos_deployment_target\n    local ios_deployment_cfg\n    local target_rustflags\n\n    sdk_root=\"$(xcrun --sdk macosx --show-sdk-path)\"\n    iphoneos_deployment_target=\"${IPHONEOS_DEPLOYMENT_TARGET:-16.0}\"\n    ios_deployment_cfg=\"fire_ios_deployment_target_${iphoneos_deployment_target//./_}\"\n    target_rustflags=\"${RUSTFLAGS:-} --cfg=$ios_deployment_cfg\"\n\n    env -i \\\n      HOME=\"$HOME\" \\\n      PATH=\"$PATH\" \\\n      SDKROOT=\"$sdk_root\" \\\n      PLATFORM_NAME= \\\n      EFFECTIVE_PLATFORM_NAME= \\\n      ARCHS= \\\n      IPHONEOS_DEPLOYMENT_TARGET=\"$iphoneos_deployment_target\" \\\n      RUSTFLAGS=\"$target_rustflags\" \\\n      TVOS_DEPLOYMENT_TARGET= \\\n      WATCHOS_DEPLOYMENT_TARGET= \\\n      \"$@\"\n  else\n    \"$@\"\n  fi\n}\n\ndedupe_targets\n\n(\n  cd \"$repo_root\"\n  if [[ \"$profile_dir\" == \"release\" ]]; then\n    run_host_cargo \"$cargo_bin\" build -p fire-uniffi --lib --release\n  else\n    run_host_cargo \"$cargo_bin\" build -p fire-uniffi --lib\n  fi\n  run_host_cargo \"$cargo_bin\" build -p fire-uniffi --bin uniffi-bindgen\n  RUSTFLAGS= \\\n  IPHONEOS_DEPLOYMENT_TARGET=16.0 \\\n  \"$repo_root/target/debug/uniffi-bindgen\" generate \\\n    --library \"$repo_root/target/$profile_dir/libfire_uniffi.dylib\" \\\n    --language swift \\\n    --no-format \\\n    --out-dir \"$tmp_dir/bindings\"\n)\n\n# The fire-uniffi dylib bundles multiple UniFFI namespaces (fire_uniffi,\n# fire_uniffi_types, fire_uniffi_diagnostics, ...). Without a Swift ffi_module_name\n# override, bindgen emits one <namespace>FFI.{h,modulemap} per namespace and the\n# generated Swift files import their own per-namespace FFI module.\n#\n# We collapse every namespace into a single clang module \"fire_uniffiFFI\" that\n# all Swift sources import. That keeps the Xcode integration simple (one\n# modulemap, one include path) and is a strict superset of any one namespace's\n# FFI surface, so no symbols are lost.\n\n# Merge every per-namespace FFI header into one fire_uniffiFFI.h. The per-file\n# UNIFFI_SHARED_H / UNIFFI_FFIDEF_* guards keep duplicate typedefs out of the\n# concatenation; only #pragma once appears multiple times, which clang allows\n# (and the module is never #include-d in another TU).\n{\n  for header in \"$tmp_dir/bindings\"/*FFI.h; do\n    cat \"$header\"\n  done\n} > \"$ffi_out_dir/fire_uniffiFFI.h\"\n\ncat > \"$ffi_out_dir/module.modulemap\" <<'MODULEMAP'\nmodule fire_uniffiFFI {\n    header \"fire_uniffiFFI.h\"\n    export *\n    use \"Darwin\"\n    use \"_Builtin_stdbool\"\n    use \"_Builtin_stdint\"\n}\nMODULEMAP\n\n# Copy Swift sources and rewrite per-namespace FFI imports to the unified module.\nfor swift_file in \"$tmp_dir/bindings\"/*.swift; do\n  python3 - \"$swift_file\" \"$swift_out_dir/$(basename \"$swift_file\")\" <<'PY'\nimport re\nimport sys\n\nsrc, dst = sys.argv[1], sys.argv[2]\npattern = re.compile(r\"\\bfire_uniffi(?:_[a-z_]+)?FFI\\b\")\nwith open(src, \"r\", encoding=\"utf-8\") as fh:\n    text = fh.read()\ntext = pattern.sub(\"fire_uniffiFFI\", text)\nwith open(dst, \"w\", encoding=\"utf-8\") as fh:\n    fh.write(text)\nPY\ndone\n\npython3 - <<'PY' \"$swift_out_dir\"\nfrom pathlib import Path\nimport sys\n\ndirectory = Path(sys.argv[1])\nreplacements = {\n    '            if result == nil {\\n                print(\"Uniffi callback interface MessageBusEventHandler: handle missing in uniffiFree\")\\n            }\\n':\n    '            if result == nil {\\n                #if DEBUG\\n                print(\"Uniffi callback interface MessageBusEventHandler: handle missing in uniffiFree\")\\n                #endif\\n            }\\n',\n    '    } else {\\n        print(\"uniffiFutureContinuationCallback invalid handle\")\\n    }\\n':\n    '    } else {\\n        #if DEBUG\\n        print(\"uniffiFutureContinuationCallback invalid handle\")\\n        #endif\\n    }\\n',\n}\n\nfor path in sorted(directory.glob(\"*.swift\")):\n    text = path.read_text()\n    updated = text\n    for before, after in replacements.items():\n        updated = updated.replace(before, after)\n    if updated != text:\n        path.write_text(updated)\nPY\n\ndeclare -a built_libraries=()\n\nfor rust_target in \"${rust_targets[@]}\"; do\n  build_staticlib \"$rust_target\"\n  built_libraries+=(\"$repo_root/target/$rust_target/$profile_dir/libfire_uniffi.a\")\ndone\n\nfinal_library_path=\"$lib_out_root/$platform_name/libfire_uniffi.a\"\n\nif [[ ${#built_libraries[@]} -eq 1 ]]; then\n  cp \"${built_libraries[0]}\" \"$final_library_path\"\nelse\n  simulator_library_path=\"$tmp_dir/libfire_uniffi.a\"\n  xcrun lipo -create \"${built_libraries[@]}\" -output \"$simulator_library_path\"\n  cp \"$simulator_library_path\" \"$final_library_path\"\nfi\n";
			showEnvVarsInLog = 0;
